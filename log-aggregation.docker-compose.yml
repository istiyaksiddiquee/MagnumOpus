services:

  loki:
    image: grafana/loki:3.2.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./log-aggregation/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - magnumopus-airflow-net

  promtail:
    image: grafana/promtail:3.2.0
    container_name: promtail
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./log-aggregation/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - magnumopus-airflow-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8085:8080"
    networks:
      - magnumopus-airflow-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./log-aggregation/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
    networks:
      - magnumopus-airflow-net

  grafana-logs:
    image: grafana/grafana:11.3.0
    container_name: grafana-logs
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./log-aggregation/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    networks:
      - magnumopus-airflow-net

volumes:
  loki_data:
  grafana_data:
  prometheus_data:

networks:
  magnumopus-airflow-net:
    external: true
    name: magnumopus-airflow-net
