services:

  # ---------------------------------------------------------------------
  # Pulsar (standalone: broker + bookkeeper + local zookeeper in one node)
  # ---------------------------------------------------------------------
  pulsar:
    image: apachepulsar/pulsar:3.3.2
    container_name: pulsar
    hostname: pulsar
    command: bin/pulsar standalone
    ports:
      - "6650:6650"   # broker (binary protocol) -- producer/Flink connect here
      - "8082:8080"   # admin/REST API + topic stats UI
    volumes:
      - pulsar_data:/pulsar/data
    networks:
      - magnumopus-airflow-net
    healthcheck:
      # pulsar-admin is bundled in the image, so this avoids depending on
      # curl (not guaranteed to be present in the base image).
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  pulsar-init-topics:
    image: apachepulsar/pulsar:3.3.2
    container_name: pulsar-init-topics
    entrypoint: >
      bash -c "
      bin/pulsar-admin topics create persistent://public/default/trip-events || true &&
      bin/pulsar-admin topics create persistent://public/default/trip-events-summary || true
      "
    depends_on:
      pulsar:
        condition: service_healthy
    networks:
      - magnumopus-airflow-net

  # ---------------------------------------------------------------------
  # Fluss -> Pulsar producer (long-running Python container from step 1)
  # ---------------------------------------------------------------------
  fluss-to-pulsar-producer:
    build:
      context: ./pulsar-producer
      dockerfile: Dockerfile
    container_name: fluss-to-pulsar-producer
    restart: unless-stopped
    environment:
      FLUSS_BOOTSTRAP_SERVERS: coordinator-server:9123
      FLUSS_DATABASE: lakehouse_db
      FLUSS_TABLE: trip_events_stream
      PULSAR_SERVICE_URL: pulsar://pulsar:6650
      PULSAR_TOPIC: trip-events
      OFFSET_STATE_PATH: /var/lib/producer/offset.json
    volumes:
      - producer_offset_volume:/var/lib/producer
    depends_on:
      pulsar:
        condition: service_healthy
      pulsar-init-topics:
        condition: service_completed_successfully
    networks:
      - magnumopus-airflow-net

