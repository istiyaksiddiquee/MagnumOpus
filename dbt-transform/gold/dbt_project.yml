name: 'gold'
version: '1.0.0'
config-version: 2

profile: 'gold'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  gold:
    +file_format: parquet
    +location_root: s3a://warehouse/gold

    ml:
      +materialized: incremental
      +incremental_strategy: merge

    streaming:
      +materialized: table

    analysis:
      +materialized: table
